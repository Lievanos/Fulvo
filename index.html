<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mis equipos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--ink:#182030;--muted:#5d6778;--bg:#eef1f5;--card:#fff;--line:#d9dfe8;--c1:#0B2A6B;--c2:#FFD500}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 Barlow,system-ui,sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
h1,h2,.num{font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-weight:700;margin:0}
main{max-width:640px;margin:0 auto;padding:0 12px 32px}
nav{display:flex;gap:6px;padding:12px 0;position:sticky;top:0;background:var(--bg);z-index:2}
nav button{flex:1;border:2px solid var(--line);background:var(--card);border-radius:8px;padding:10px 4px;font:600 17px "Barlow Condensed","Arial Narrow",sans-serif;color:var(--ink);cursor:pointer}
nav button[aria-selected=true]{background:var(--c1);border-color:var(--c1);color:#fff;box-shadow:inset 0 -4px 0 var(--c2)}
button:focus-visible{outline:3px solid var(--c2);outline-offset:2px}
.hero{background:var(--c1);color:#fff;border-radius:12px;padding:16px;border-bottom:6px solid var(--c2)}
.hero small{opacity:.85}
.score{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;margin:12px 0 4px;text-align:center}
.score img{width:56px;height:56px;object-fit:contain;background:#fff;border-radius:50%;padding:4px}
.score .team{display:flex;flex-direction:column;align-items:center;gap:6px;font-weight:500}
.num{font-size:52px;line-height:1}
.live{display:inline-block;background:#d7263d;color:#fff;border-radius:4px;padding:1px 8px;font-weight:500;font-size:14px}
h2{font-size:24px;margin:22px 0 8px}
.row{background:var(--card);border:1px solid var(--line);border-radius:8px;margin-bottom:8px;overflow:hidden}
.row>button{all:unset;box-sizing:border-box;display:block;width:100%;padding:10px 12px;cursor:pointer}
.row>button:focus-visible{outline:3px solid var(--c1);outline-offset:-3px}
.meta{color:var(--muted);font-size:14px}
.line{display:flex;justify-content:space-between;gap:8px;font-weight:500}
.line b{font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-size:20px;white-space:nowrap}
.detail{border-top:1px solid var(--line);padding:10px 12px;font-size:15px}
.detail h3{margin:12px 0 6px;font:700 18px "Barlow Condensed","Arial Narrow",sans-serif}
.bar{display:grid;grid-template-columns:44px 1fr 44px;gap:8px;align-items:center;margin:5px 0;font-size:14px}
.bar span:last-child{text-align:right}
.bar div{text-align:center;color:var(--muted)}
.trk{height:6px;background:var(--line);border-radius:3px;display:flex;justify-content:flex-end;margin-top:3px}
.trk i{display:block;height:100%;background:var(--c1);border-radius:3px 0 0 3px}
.trk2{height:6px;background:var(--c2);flex:1}
.err{background:#fff3f3;border:1px solid #e8b4b4;border-radius:8px;padding:12px;margin-top:12px}
ul{margin:0;padding-left:18px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (prefers-reduced-motion:no-preference){.live{animation:p 1.6s ease-in-out infinite}@keyframes p{50%{opacity:.55}}}
</style>
</head>
<body>
<main>
  <nav role="tablist" id="tabs"></nav>
  <section id="view" aria-live="polite"></section>
</main>
<script>
const TEAMS=[
  {k:'america',n:'América',c1:'#0B2A6B',c2:'#FFD500'},
  {k:'barcelona',n:'Barcelona',c1:'#004D98',c2:'#A50044'},
  {k:'mexico',n:'México',c1:'#006847',c2:'#CE1126'}
];
const LIVE=['1H','2H','HT','ET','BT','P','LIVE','INT'], DONE=['FT','AET','PEN'];
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=d=>new Date(d).toLocaleString('es-MX',{weekday:'short',day:'numeric',month:'short',hour:'2-digit',minute:'2-digit',timeZone:'America/Mexico_City'});
let cur=TEAMS[0].k, timer=null;

function tabs(){
  $('#tabs').innerHTML=TEAMS.map(t=>`<button role="tab" data-k="${t.k}" aria-selected="${t.k===cur}">${t.n}</button>`).join('');
  $('#tabs').querySelectorAll('button').forEach(b=>b.onclick=()=>{cur=b.dataset.k;tabs();load()});
  const t=TEAMS.find(t=>t.k===cur);
  document.documentElement.style.setProperty('--c1',t.c1);
  document.documentElement.style.setProperty('--c2',t.c2);
}

function status(f){
  if(LIVE.includes(f.status)) return `<span class="live">${f.status==='HT'?'Medio tiempo':"En vivo "+(f.minute||'')+"'"}</span>`;
  if(DONE.includes(f.status)) return 'Final';
  if(f.status==='PST') return 'Pospuesto';
  if(f.status==='CANC') return 'Cancelado';
  return fmt(f.date);
}
const goals=f=>f.goals.home==null?'vs':`${f.goals.home} - ${f.goals.away}`;

function hero(f){
  return `<div class="hero"><small>${esc(f.league)} · ${esc(f.round)}</small>
  <div class="score"><div class="team"><img src="${esc(f.home.logo)}" alt=""><span>${esc(f.home.name)}</span></div>
  <div class="num">${f.goals.home==null?'vs':f.goals.home+' - '+f.goals.away}</div>
  <div class="team"><img src="${esc(f.away.logo)}" alt=""><span>${esc(f.away.name)}</span></div></div>
  <div style="text-align:center">${status(f)}${f.venue?'<br><small>'+esc(f.venue)+'</small>':''}</div></div>`;
}

function row(f){
  return `<div class="row"><button data-id="${f.id}" aria-expanded="false">
  <div class="meta">${status(f)} · ${esc(f.league)}</div>
  <div class="line"><span>${esc(f.home.name)} vs ${esc(f.away.name)}</span><b>${goals(f)}</b></div></button></div>`;
}

function bars(stats){
  const want=['Ball Possession','Total Shots','Shots on Goal','Corner Kicks','Fouls','Yellow Cards','Red Cards'];
  const es={'Ball Possession':'Posesión','Total Shots':'Tiros','Shots on Goal':'Tiros a gol','Corner Kicks':'Tiros de esquina','Fouls':'Faltas','Yellow Cards':'Amarillas','Red Cards':'Rojas'};
  return stats.filter(s=>want.includes(s.type)).map(s=>{
    const a=parseFloat(s.home)||0,b=parseFloat(s.away)||0,p=a+b?a/(a+b)*100:50;
    return `<div class="bar"><span>${esc(s.home??0)}</span><div>${es[s.type]}<div class="trk"><i style="width:${p}%"></i><span class="trk2" style="flex:${100-p}"></span></div></div><span>${esc(s.away??0)}</span></div>`;
  }).join('');
}

async function detail(btn){
  const box=btn.parentElement; let d=box.querySelector('.detail');
  if(d){d.remove();btn.setAttribute('aria-expanded','false');return}
  btn.setAttribute('aria-expanded','true');
  d=document.createElement('div');d.className='detail';d.textContent='Cargando…';box.appendChild(d);
  try{
    const r=await fetch('/api/match/'+btn.dataset.id);const j=await r.json();
    if(!r.ok)throw new Error(j.error);
    let h='';
    if(j.stats.length)h+='<h3>Estadísticas</h3>'+bars(j.stats);
    if(j.events.length)h+='<h3>Eventos</h3><ul>'+j.events.map(e=>`<li>${e.minute}' ${esc(e.type)} ${esc(e.detail)} — ${esc(e.player||'')} (${esc(e.team)})</li>`).join('')+'</ul>';
    if(j.lineups.length)h+='<h3>Alineaciones</h3><div class="two">'+j.lineups.map(l=>`<div><b>${esc(l.team)}</b><br><small>${esc(l.formation||'')} · DT ${esc(l.coach||'—')}</small><ul>${l.startXI.map(p=>'<li>'+esc(p)+'</li>').join('')}</ul></div>`).join('')+'</div>';
    d.innerHTML=h||'<span class="meta">Todavía no hay estadísticas, eventos ni alineaciones de este partido.</span>';
  }catch(e){d.innerHTML='<span class="meta">No se pudo cargar el detalle: '+esc(e.message)+'</span>'}
}

async function load(){
  clearTimeout(timer);
  const v=$('#view');v.innerHTML='<p class="meta">Cargando…</p>';
  try{
    const r=await fetch('/api/team/'+cur);const j=await r.json();
    if(!r.ok)throw new Error(j.error);
    const main=j.live||j.next[0]||j.last[j.last.length-1];
    let h=main?hero(main):'<p>No hay partidos para mostrar.</p>';
    if(j.next.length)h+='<h2>Próximos partidos</h2>'+j.next.map(row).join('');
    if(j.last.length)h+='<h2>Últimos resultados</h2>'+j.last.map(row).join('');
    v.innerHTML=h;
    v.querySelectorAll('.row>button').forEach(b=>b.onclick=()=>detail(b));
    if(j.live)timer=setTimeout(load,60000);
  }catch(e){
    v.innerHTML='<div class="err"><b>No se pudieron cargar los datos.</b><br>'+esc(e.message)+'</div>';
  }
}
tabs();load();
</script>
</body>
</html>
